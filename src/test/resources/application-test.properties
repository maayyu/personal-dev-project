# ServiceConnection supplies both JDBC and Flyway connection details.
# Fail closed if a test forgets to import PostgresTestConfiguration.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/testcontainer_required
spring.datasource.username=test
spring.datasource.password=test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.docker.compose.enabled=false
